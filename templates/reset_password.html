{% extends "base.html" %}

{% block title %}Reset Password | Kidapawan City Visual Artists{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-6 bg-neutral-900 ring-1 ring-white/10 rounded-xl">
    <h2 class="text-xl font-bold text-white mb-2">Set a New Password</h2>
    <p class="text-xs text-neutral-400 mb-6">
        Enter your new password below.
    </p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div>
            <label for="password" class="block text-xs font-medium text-neutral-300 mb-1">New Password (Minimum 8
                characters)</label>
            <input type="password" id="password" name="password" required minlength="8"
                class="w-full rounded-md border-0 bg-neutral-950 px-3 py-2 text-sm text-white ring-1 ring-white/15 focus:outline-none focus:ring-2 focus:ring-[#acb2b5]">
        </div>

        <div>
            <label for="confirm" class="block text-xs font-medium text-neutral-300 mb-1">Confirm New
                Password</label>
            <input type="password" id="confirm" name="confirm" required minlength="8"
                class="w-full rounded-md border-0 bg-neutral-950 px-3 py-2 text-sm text-white ring-1 ring-white/15 focus:outline-none focus:ring-2 focus:ring-[#acb2b5]">
        </div>

        <button type="submit"
            class="w-full py-2.5 px-4 bg-white text-black font-semibold text-xs rounded-md hover:bg-neutral-200 transition">
            Update Password
        </button>
    </form>
</div>
{% endblock %}
