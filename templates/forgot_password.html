{% extends "base.html" %}

{% block title %}Forgot Password | Kidapawan City Visual Artists{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-6 bg-neutral-900 ring-1 ring-white/10 rounded-xl">
    <h2 class="text-xl font-bold text-white mb-2">Forgot your password?</h2>
    <p class="text-xs text-neutral-400 mb-6">
        Enter your email address below and we will send you a password reset link.
    </p>

    <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div>
            <label for="email" class="block text-xs font-medium text-neutral-300 mb-1">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com"
                class="w-full rounded-md border-0 bg-neutral-950 px-3 py-2 text-sm text-white ring-1 ring-white/15 focus:outline-none focus:ring-2 focus:ring-[#acb2b5]">
        </div>

        <button type="submit"
            class="w-full py-2.5 px-4 bg-white text-black font-semibold text-xs rounded-md hover:bg-neutral-200 transition">
            Send Reset Link
        </button>

        <div class="text-center pt-2">
            <a href="{{ url_for('login') }}" class="text-xs text-neutral-400 hover:text-white">
                ← Back to Login
            </a>
        </div>
    </form>
</div>
{% endblock %}
